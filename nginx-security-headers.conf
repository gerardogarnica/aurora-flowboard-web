# Headers de seguridad. Se incluye a nivel `server` y otra vez en cada `location`
# que declara su propio `add_header`: nginx descarta los `add_header` heredados en
# cuanto un bloque define uno propio, así que sin repetir el include esas rutas
# (assets, index.html) saldrían sin headers.
#
# CSP:
# - script-src 'self': el build de Vite solo emite <script type="module" src>, sin inline.
# - style-src 'unsafe-inline': sonner y Base UI inyectan <style> en runtime; un sitio
#   estático no puede generar nonces por request.
# - img-src / font-src data:: Vite inlinea como data: los assets menores a 4 KB.
# - connect-src: __API_ORIGIN__ lo reemplaza el Dockerfile con el origen de
#   VITE_API_BASE_URL (vacío si la API es relativa, p. ej. /api).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'__API_ORIGIN__; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
